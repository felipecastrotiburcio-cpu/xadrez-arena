# Teste de uso no simulador de iPhone (o Maestro toca na tela como uma pessoa).
# No iOS um botão junta os textos de dentro num rótulo só ("JOGAR!, Contra a IA…"),
# por isso os textos usam ".*…*" (contém) e os campos usam identificadores fixos (testID).
appId: app.xadrezarena
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: ".*JOGAR!.*"
    timeout: 90000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: ${OUT}/01-inicio

# Partida contra a IA com relógio de 5 minutos
# A tela inicial carrega o boneco 3D; um toque durante o carregamento pode se perder,
# então tenta de novo se a tela não mudar.
- retry:
    maxRetries: 3
    commands:
      - waitForAnimationToEnd:
          timeout: 5000
      - tapOn: ".*5 níveis, offline.*"
      - extendedWaitUntil:
          visible: ".*Peão Curioso.*"
          timeout: 10000
- tapOn: ".*Peão Curioso.*"
- scrollUntilVisible:
    element:
      id: "seg-5"
- tapOn:
    id: "seg-5"
- tapOn: ".*Começar partida.*"
- extendedWaitUntil:
    visible: "e2 branco p"
    timeout: 20000
- takeScreenshot: ${OUT}/02-tabuleiro
- tapOn: "e2 branco p"
- tapOn: "e4"
- extendedWaitUntil:
    visible: "e4 branco p"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: ${OUT}/03-ia-respondeu
# Lance ilegal (o peão de e4 não anda duas casas): a peça continua em e4
- tapOn: "e4 branco p"
- tapOn: "e6"
- assertVisible: "e4 branco p"

# Desistir -> finalização 3D com música -> resultado
- tapOn: ".*Desistir.*"
- tapOn: "Desistir"   # botão do alerta de confirmação do iOS
- extendedWaitUntil:
    visible: ".*Pular.*"
    timeout: 20000
- swipe:   # gesto neutro só para esperar a cena 3D (~4 s) sem fechar a finalização
    start: 50%, 20%
    end: 50%, 21%
    duration: 4000
- takeScreenshot: ${OUT}/04-finalizacao-3d
# A finalização fecha sozinha após 9 s; se ainda estiver aberta, pula.
- tapOn:
    text: ".*Pular.*"
    optional: true
- extendedWaitUntil:
    visible: ".*Derrota.*"
    timeout: 20000
- takeScreenshot: ${OUT}/05-resultado

# Criar conta no aparelho
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: ".*JOGAR!.*"
    timeout: 60000
- retry:
    maxRetries: 3
    commands:
      - waitForAnimationToEnd:
          timeout: 5000
      - tapOn: "Criar conta"
      - extendedWaitUntil:
          visible:
            id: "login-username"
          timeout: 10000
- tapOn:
    id: "seg-register"
- tapOn:
    id: "login-username"
# Na primeira vez o iOS mostra o tutorial do teclado ("deslize para digitar"): fecha.
- tapOn:
    text: "Continue|Continuar"
    optional: true
- tapOn:
    id: "login-username"
- inputText: ${USERNAME}
# "Próximo" no teclado passa para o campo de senha
- pressKey: Enter
- inputText: "segredo123"
# "Ir" no teclado envia o formulário
- pressKey: Enter
# Conta criada: volta para a tela inicial, com o nome e o saldo de 300 moedas
- extendedWaitUntil:
    visible: ".*JOGAR!.*"
    timeout: 30000
- assertVisible: ".*${USERNAME}.*"
- assertNotVisible:
    id: "login-username"
- assertVisible: ".*300.*"
- takeScreenshot: ${OUT}/06-conta-criada

# Loja: comprar "Verde Torneio" (150) e abrir a prévia de outro tabuleiro
- retry:
    maxRetries: 3
    commands:
      - waitForAnimationToEnd:
          timeout: 5000
      - tapOn: ".*Loja.*"
      - extendedWaitUntil:
          visible: ".*Verde Torneio.*"
          timeout: 10000
# Abre a prévia do "Verde Torneio" (150) e compra por ela
- tapOn: ".*Verde Torneio.*"
- extendedWaitUntil:
    visible: ".*Toque nas peças.*"
    timeout: 15000
- tapOn: ".*Comprar · .*"
- tapOn: "Comprar"   # botão do alerta de confirmação do iOS
- extendedWaitUntil:
    visible: ".*Equipado.*"
    timeout: 15000
- takeScreenshot: ${OUT}/07-compra
- tapOn: ".*Fechar.*"
- tapOn: ".*Nogueira Entalhada.*"
- extendedWaitUntil:
    visible: ".*Toque nas peças.*"
    timeout: 15000
- assertVisible: ".*Comprar · .*300.*"
- takeScreenshot: ${OUT}/08-previa
- tapOn: ".*Fechar.*"
